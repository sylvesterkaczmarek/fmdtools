name: Pinned maintenance regression validation
on:
  push:
    branches: [validation/merge-wave-20261007]
    paths: [.github/workflows/merge-wave-validation.yml]
permissions:
  contents: read
env:
  BASE_SHA: 0aa579a6c77ef61e230512c7116e87b5b1186d8f
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  verify:
    name: PR ${{ matrix.pr }} regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {pr: 281, head: cf27a7fa8ceed3eccb3c27603f2537da28beb8e3}
          - {pr: 283, head: 5c4dd462fdbdbfa0f9dd7d659d4e2e7f1cb23050}
          - {pr: 285, head: 93624e54471ca60484e609e5d2f9616c8d701735}
          - {pr: 287, head: 4d566303507165a829d4ac4f3e7a7d47c82aa202}
          - {pr: 289, head: a216ca78374eb003b0c7c90348030fa75b0f7979}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0aa579a6c77ef61e230512c7116e87b5b1186d8f
          fetch-depth: 0
          persist-credentials: false
      - name: Construct the candidate from clean pinned-base sources
        shell: bash
        env:
          PR_HEAD: ${{ matrix.head }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Clone-local override keeps historical data blobs unchanged in Git.
          attributes=$(git rev-parse --git-path info/attributes)
          mkdir -p "$(dirname "$attributes")"
          printf '* -filter\n' > "$attributes"
          # Only this disposable runner checkout is materialized from its index.
          git checkout-index --all --force
          git update-index --refresh
          git diff --exit-code
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$PR_HEAD"
          git diff --cached --check
          git diff --check
          git write-tree
      - name: Install project and regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/test-env"
          "$RUNNER_TEMP/test-env/bin/python" -m pip install --quiet --disable-pip-version-check '.[all]' pytest-cov ipython
      - name: Run the affected regression files
        shell: bash
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests:$GITHUB_WORKSPACE/examples"
          mapfile -t tests < <(git diff --name-only "$BASE_SHA" -- tests | grep '\.py$')
          test "${#tests[@]}" -gt 0
          printf 'Regression file: %s\n' "${tests[@]}"
          "$RUNNER_TEMP/test-env/bin/python" -m pytest --testtype=custom -o addopts= -q --junitxml="$RUNNER_TEMP/regressions.xml" "${tests[@]}"
          python3 - "$RUNNER_TEMP/regressions.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for suite in ET.parse(sys.argv[1]).getroot().iter('testsuite'):
              print('REGRESSION_SUMMARY', suite.attrib)
          PY
  publish_validated_candidates:
    name: Preserve validated candidate for PR ${{ matrix.pr }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      max-parallel: 2
      matrix:
        include:
          - {pr: 281, head: cf27a7fa8ceed3eccb3c27603f2537da28beb8e3}
          - {pr: 283, head: 5c4dd462fdbdbfa0f9dd7d659d4e2e7f1cb23050}
          - {pr: 285, head: 93624e54471ca60484e609e5d2f9616c8d701735}
          - {pr: 287, head: 4d566303507165a829d4ac4f3e7a7d47c82aa202}
          - {pr: 289, head: a216ca78374eb003b0c7c90348030fa75b0f7979}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0aa579a6c77ef61e230512c7116e87b5b1186d8f
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the tested source without executing repository code
        shell: bash
        env:
          PR_HEAD: ${{ matrix.head }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          attributes=$(git rev-parse --git-path info/attributes)
          mkdir -p "$(dirname "$attributes")"
          printf '* -filter\n' > "$attributes"
          git checkout-index --all --force
          git update-index --refresh
          git diff --exit-code
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$PR_HEAD"
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'Refresh onto pinned dev after regression validation'
          git rev-parse HEAD
      - name: Publish only a candidate branch for inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          candidate="validation/merge-wave-20261007-pr-${PR_NUMBER}"
          gh auth setup-git
          test -z "$(git ls-remote --heads origin "$candidate")"
          git push origin "HEAD:refs/heads/$candidate"
          echo "VALIDATED_CANDIDATE $candidate $(git rev-parse HEAD)"
